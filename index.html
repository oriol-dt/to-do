<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>App de Tareas (To-Do)</title>
        <link rel="stylesheet" type="text/css" href="assets/css/to-do.css" />
        <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="shortcut icon" href="favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="ToDo" />
        <link rel="manifest" href="site.webmanifest" />
    </head>
    <body>
        <div class="container">
            <h1>To-Do</h1>
            <form id="task-form">
                <label for="task-title"></label>
                <input type="text" id="task-title" placeholder="Escribe una nueva tarea" required>
                <button type="submit">Crear</button>
            </form>
            <h1>Lista de Tareas</h1>
            <ul id="task-list">

            </ul>
        </div>

        <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
            <div class="modal-content">
                <h2 id="edit-modal-title">Editar tarea</h2>
                <form id="edit-form">
                    <label for="edit-task-title">Título</label>
                    <input type="text" id="edit-task-title" required>
                    <div class="modal-actions">
                        <button type="button" id="cancel-edit">Cancelar</button>
                        <button type="submit" id="save-edit">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="assets/js/app.js"></script>
    </body>
</html>
